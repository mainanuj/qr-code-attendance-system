<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Gradients matching Concept 2 -->
    <linearGradient id="attFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="60%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="attAGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="attCheckGrad" x1="0%" y1="50%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="attBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172e" />
      <stop offset="100%" stop-color="#060b17" />
    </linearGradient>
    <filter id="attGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Badge -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#attBgGrad)" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2" />

  <!-- Background QR Frame Box (Concept 2 feature) -->
  <rect x="25" y="24" width="62" height="62" rx="8" stroke="url(#attFrameGrad)" stroke-width="5" stroke-opacity="0.85" fill="none" />

  <!-- Geometric 'A' Monogram -->
  <!-- Left leg: from bottom-left (20, 86) to peak (56, 20) -->
  <path d="M22 86 L56 22 L75 58" stroke="url(#attAGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

  <!-- The verified checkmark originating from inside the right leg and shooting up-right -->
  <path d="M54 68 L68 82 L98 44" stroke="url(#attCheckGrad)" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#attGlow)" />

  <!-- Central QR Viewfinder Aperture (target box inside the A) -->
  <!-- Top-left bracket -->
  <path d="M50 50 H47 V53" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Top-right bracket -->
  <path d="M60 50 H63 V53" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom-left bracket -->
  <path d="M47 59 V62 H50" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Bottom-right bracket -->
  <path d="M63 59 V62 H60" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Central QR dot -->
  <rect x="52.5" y="53.5" width="5" height="5" rx="1.2" fill="#22d3ee" />
</svg>
